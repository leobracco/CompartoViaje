<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#054752" />
  <meta name="description" content="CompartoViaje — movilidad colaborativa en Argentina. Publicá y reservá viajes entre ciudades, pagá con Mercado Pago." />
  <title>CompartoViaje · Movilidad colaborativa AR</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-logo">CV</span>
      <span class="brand-name">Comparto<span class="accent">Viaje</span></span>
    </a>
    <nav id="nav"></nav>
  </header>
  <main id="view" class="view"></main>
  <footer class="bottombar">
    <a href="#/" data-icon="home">Inicio</a>
    <a href="#/search" data-icon="search">Buscar</a>
    <a href="#/publish" data-icon="plus">Publicar</a>
    <a href="#/bookings" data-icon="ticket">Viajes</a>
    <a href="#/me" data-icon="user">Perfil</a>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
