<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b8457" />
  <meta name="description" content="CompartoViaje — movilidad colaborativa en Argentina. Publicá y reservá viajes entre ciudades, pagá con Mercado Pago." />
  <title>CompartoViaje</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-logo" aria-hidden="true">🚗</span>
      <span class="brand-name">CompartoViaje</span>
    </a>
    <nav id="nav"></nav>
  </header>
  <main id="view" class="view"></main>
  <footer class="bottombar">
    <a href="#/">Buscar</a>
    <a href="#/publish">Publicar</a>
    <a href="#/bookings">Reservas</a>
    <a href="#/me">Mi cuenta</a>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
